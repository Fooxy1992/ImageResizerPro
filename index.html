    <title>Image Resizer Pro</title>
    <meta name="description" content="A powerful web application to batch resize, upscale, and convert multiple images with preserved initial filenames, anti-distortion fitting modes, and ZIP export." />
    <meta property="og:title" content="Image Resizer Pro" />
    <meta property="og:description" content="A powerful web application to batch resize, upscale, and convert multiple images with preserved initial filenames, anti-distortion fitting modes, and ZIP export." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://esm.sh/react-image-crop/dist/ReactCrop.css">
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .ReactCrop__crop-selection {
        border: 2px dashed #06b6d4; /* cyan-500 */
      }
      .show-grid .ReactCrop__crop-selection::before,
      .show-grid .ReactCrop__crop-selection::after {
        content: '';
        position: absolute;
        pointer-events: none;
        box-sizing: border-box;
      }
      .show-grid .ReactCrop__crop-selection::before {
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-top: 1px solid rgba(255, 255, 255, 0.5);
        border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        top: 33.33%;
        height: 33.33%;
      }
      .show-grid .ReactCrop__crop-selection::after {
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-left: 1px solid rgba(255, 255, 255, 0.5);
        border-right: 1px solid rgba(255, 255, 255, 0.5);
        left: 33.33%;
        width: 33.33%;
      }
    </style>
